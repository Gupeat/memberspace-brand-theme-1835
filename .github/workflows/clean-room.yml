name: clean-room

on:
  push:
    branches: [main, ci/github-actions]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build theme
        run: python scripts/build.py
      - name: Run tests
        run: python -m pytest -q tests
      - name: Validate theme and TDesign consumption
        run: python scripts/validate.py
      - name: Verify Figma export
        run: python scripts/verify_figma_export.py
      - name: Verify DevTools evidence
        run: python scripts/verify_devtools_evidence.py
